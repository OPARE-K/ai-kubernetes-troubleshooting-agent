apiVersion: v1
kind: Pod
metadata:
  name: backend-api
  namespace: ai-agent-test
  labels:
    app: backend-api
    scenario: service-selector
spec:
  containers:
    - name: api
      image: nginx:1.25-alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: ai-agent-test
  labels:
    scenario: service-selector
spec:
  selector:
    app: wrong-label
  ports:
    - port: 80
      targetPort: 80
