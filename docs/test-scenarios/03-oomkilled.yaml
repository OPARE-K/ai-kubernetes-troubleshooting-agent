apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-demo
  namespace: ai-agent-test
  labels:
    scenario: oomkilled
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-demo
  template:
    metadata:
      labels:
        app: oom-demo
        scenario: oomkilled
    spec:
      containers:
        - name: memory-hog
          image: polinux/stress
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "128M", "--vm-hang", "1"]
          resources:
            limits:
              memory: 16Mi
            requests:
              memory: 16Mi
